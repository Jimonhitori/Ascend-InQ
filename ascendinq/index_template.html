<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ascend InQ — 試合一覧</title>
<style>
:root{--bg:#0e1115;--panel:#161b21;--panel2:#1d232b;--line:#2a323c;--text:#e7e9ec;--muted:#8b95a1;
  --gold:#c8aa6e;--blue:#4fa3ff;--red:#ff5d5d;--green:#43c59e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Yu Gothic UI","Meiryo","Hiragino Sans",sans-serif;font-size:14px;line-height:1.6}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
h1{font-size:22px;margin:0;color:var(--gold);letter-spacing:.04em}
.sub{color:var(--muted)}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin:18px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card h2{font-size:16px;margin:0 0 12px}
.focus{padding:16px 20px;border-radius:12px;background:linear-gradient(90deg,rgba(200,170,110,.18),rgba(200,170,110,.04));border:1px solid rgba(200,170,110,.4)}
.focus .k{color:var(--gold);font-size:12px;letter-spacing:.1em}.focus .v{font-size:18px;font-weight:bold}
.cause{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.cause .track{height:14px;background:#11161b;border-radius:7px;overflow:hidden}
.cause .fill{height:100%;border-radius:7px}
.spark{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sp-card{background:var(--panel2);border-radius:8px;padding:10px 12px}
.sp-card .k{color:var(--muted);font-size:12px}.sp-card .v{font-size:20px;font-weight:bold}
.sp-card svg{width:100%;height:40px;display:block}
.wl{display:flex;gap:4px;margin-top:10px}
.wl span{width:18px;height:18px;border-radius:4px;font-size:10px;display:flex;align-items:center;justify-content:center;color:#111;font-weight:bold}
.games{display:grid;gap:8px}
.game{display:grid;grid-template-columns:6px 52px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:10px 14px 10px 0;overflow:hidden}
.game:hover{border-color:var(--gold)}
.game .side{align-self:stretch;border-radius:10px 0 0 10px}
.game img{width:48px;height:48px;border-radius:10px}
.game .t{font-weight:bold}.game .m{color:var(--muted);font-size:12px}
.game .issue{font-size:13px;margin-top:2px}
.game .acts{display:flex;gap:6px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:13px}
.btn.p{background:var(--gold);border-color:var(--gold);color:#111;font-weight:bold}
.tag{display:inline-block;border-radius:10px;padding:0 8px;font-size:11px;margin-left:6px}
@media (max-width:820px){.grid{grid-template-columns:1fr}.game{grid-template-columns:6px 44px 1fr}.game .acts{grid-column:3}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const G = /*__DATA__*/null;  // newest first
const CAUSE = {
  gank:["敵JGのガンク","#ff5d5d"], jg_duel:["敵JGとの戦い","#ff5d5d"], low_hp:["体力が低いまま","#ff9f43"],
  outnumbered:["人数不利","#ff9f43"], bad_trade:["1v1負け","#b48cff"], died_first:["戦いで最初に倒れた","#ffd166"],
  stayed_lost:["負け戦から引けず","#ffd166"], overextend:["前に出すぎ","#ff9f43"], traded:["相打ち・交換","#7a828c"],
  skirmish:["小競り合い負け","#b48cff"], unknown:["原因不明","#7a828c"],
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const games = G.filter(g => !g.remake);
const role = r => ({ TOP: "TOP", JUNGLE: "JG", MIDDLE: "MID", BOTTOM: "ADC", UTILITY: "SUP" }[r] || r);

function causes() {
  const n = {};
  games.forEach(g => Object.entries(g.causes).forEach(([k, v]) => { if (k !== "traded") n[k] = (n[k] || 0) + v; }));
  const rows = Object.entries(n).sort((a, b) => b[1] - a[1]);
  if (!rows.length) return `<span class="sub">デスのデータがありません</span>`;
  const max = rows[0][1];
  return rows.map(([k, v]) => `<div class="cause"><span>${(CAUSE[k] || [k])[0]}</span>
    <div class="track"><div class="fill" style="width:${v / max * 100}%;background:${(CAUSE[k] || [, "#888"])[1]}"></div></div><b>${v}</b></div>`).join("");
}

function spark(key, label, fmt, goodUp) {
  const vals = games.slice().reverse().map(g => g[key]);  // oldest -> newest
  if (vals.length < 2) return "";
  const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const pts = vals.map((v, i) => `${i / (vals.length - 1) * 100},${36 - (v - min) / span * 32}`).join(" ");
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  const last = vals[vals.length - 1];
  const better = goodUp ? last >= avg : last <= avg;
  return `<div class="sp-card"><div class="k">${label}（平均 ${fmt(avg)}）</div>
    <div class="v" style="color:${better ? "var(--green)" : "var(--red)"}">${fmt(last)}</div>
    <svg viewBox="0 0 100 40" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--gold)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div>`;
}

function list() {
  return G.map(g => {
    const c = g.remake ? "#3a424c" : g.win ? "var(--blue)" : "var(--red)";
    const res = g.remake ? "リメイク" : g.win ? "勝ち" : "負け";
    const date = new Date(g.start).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    const top = g.top_cause && CAUSE[g.top_cause] ? `<span class="tag" style="background:${CAUSE[g.top_cause][1]}33;color:${CAUSE[g.top_cause][1]}">${CAUSE[g.top_cause][0]}</span>` : "";
    return `<a class="game" href="${g.id}.html"><span class="side" style="background:${c}"></span>
      <img src="assets/champion/${g.champ}.png" alt="" onerror="this.style.visibility='hidden'">
      <div><div class="t">${esc(g.champ_ja)} <span class="sub">${role(g.role)}${g.opp ? " vs " + esc(g.opp) : ""}</span>
        <span style="color:${c};margin-left:6px">${res}</span></div>
        <div class="m">${date}・${g.kda}・CS ${g.cs_min}/分・KP ${g.kp}%</div>
        ${g.issue ? `<div class="issue">${esc(g.issue)}${top}</div>` : ""}</div>
      <div class="acts"><span class="btn p" onclick="event.preventDefault();location.href='${g.id}_viewer.html'">▶ 動画</span>
        <span class="btn">レポート</span></div></a>`;
  }).join("");
}

const wins = games.filter(g => g.win).length;
document.getElementById("app").innerHTML = `
  <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><h1>Ascend InQ</h1>
    <span class="sub">直近 ${games.length} 試合　${wins}勝 ${games.length - wins}敗（勝率 ${games.length ? Math.round(wins / games.length * 100) : 0}%）</span></div>
  ${games[0] ? `<div class="focus" style="margin-top:14px"><div class="k">次の試合で意識すること（最新の試合から）</div><div class="v">${esc(games[0].focus)}</div></div>` : ""}
  <div class="grid">
    <div class="card"><h2>よくある死に方（直近${games.length}試合の合計）</h2>${causes()}</div>
    <div class="card"><h2>推移</h2><div class="spark">
      ${spark("cs_min", "CS / 分", v => v.toFixed(1), true)}
      ${spark("deaths", "デス", v => v.toFixed(1), false)}
      ${spark("kp", "キル関与率", v => Math.round(v) + "%", true)}</div>
      <div class="wl">${games.slice().reverse().map(g => `<span style="background:${g.win ? "var(--blue)" : "var(--red)"}">${g.win ? "W" : "L"}</span>`).join("")}</div>
    </div>
  </div>
  <div class="games">${list()}</div>`;
</script>
</body>
</html>
