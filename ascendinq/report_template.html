<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ | Ascend InQ</title>
<style>
:root{
  --bg:#0e1115;--panel:#161b21;--panel2:#1d232b;--line:#2a323c;--text:#e7e9ec;--muted:#8b95a1;
  --gold:#c8aa6e;--blue:#4fa3ff;--red:#ff5d5d;--green:#43c59e;--orange:#ff9f43;--purple:#b48cff;--gray:#7a828c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Yu Gothic UI","Meiryo","Hiragino Sans",sans-serif;font-size:14px;line-height:1.6}
a{color:var(--blue);text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 60px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top img{width:56px;height:56px;border-radius:12px;border:2px solid var(--gold)}
.top h1{font-size:22px;margin:0}
.top .sub{color:var(--muted)}
.badge{padding:3px 12px;border-radius:6px;font-weight:bold}
.badge.win{background:rgba(79,163,255,.18);color:var(--blue)}.badge.lose{background:rgba(255,93,93,.18);color:var(--red)}
.badge.remake{background:#2a323c;color:var(--muted)}
.sp{flex:1}
.btn{display:inline-block;background:var(--gold);color:#111;font-weight:bold;padding:8px 16px;border-radius:8px}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:normal}
.focus{margin:18px 0;padding:18px 22px;border-radius:12px;background:linear-gradient(90deg,rgba(200,170,110,.18),rgba(200,170,110,.04));
  border:1px solid rgba(200,170,110,.4)}
.focus .k{color:var(--gold);font-size:12px;letter-spacing:.1em}
.focus .v{font-size:20px;font-weight:bold;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat .k{color:var(--muted);font-size:12px}.stat .v{font-size:22px;font-weight:bold}
.stat .d{font-size:12px}.up{color:var(--green)}.down{color:var(--red)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2 .n{color:var(--muted);font-weight:normal;font-size:13px}
.full{grid-column:1/-1}
.issue{border-left:4px solid var(--c,var(--gold));background:var(--panel2);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.issue .t{font-weight:bold;font-size:15px}
.issue .when{margin:6px 0;display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;background:#11161b;border:1px solid var(--line);border-radius:12px;padding:1px 10px;font-size:12px;color:#c9cfd6}
a.chip:hover{border-color:var(--gold)}
.issue .fix{color:var(--text)}.issue .fix::before{content:"💡 ";}
.goods{display:flex;flex-wrap:wrap;gap:8px}
.good{background:rgba(67,197,158,.12);color:var(--green);border:1px solid rgba(67,197,158,.35);border-radius:16px;padding:3px 12px}
.tl{position:relative;height:46px;margin:6px 0 4px}
.tl .bar{position:absolute;left:0;right:0;top:22px;height:2px;background:var(--line)}
.tl .dot{position:absolute;top:13px;width:20px;height:20px;margin-left:-10px;border-radius:50%;border:2px solid #0e1115;cursor:pointer}
.tl .ob{position:absolute;top:0;margin-left:-8px;font-size:14px}
.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.deaths-wrap{display:grid;grid-template-columns:260px 1fr;gap:16px}
.map{position:relative;width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#1a2a22}
.map img{width:100%;height:100%;opacity:.8}
.map .x{position:absolute;transform:translate(-50%,-50%);font-weight:bold;font-size:18px;text-shadow:0 0 4px #000}
.dlist details{background:var(--panel2);border-radius:8px;margin-bottom:6px;border-left:4px solid var(--c)}
.dlist summary{cursor:pointer;padding:8px 12px;list-style:none;display:flex;gap:10px;align-items:center}
.dlist summary::-webkit-details-marker{display:none}
.dlist .tm{color:var(--muted);font-variant-numeric:tabular-nums;width:42px}
.dlist .lab{font-weight:bold}
.dlist .body{padding:0 12px 10px 64px;color:#c9cfd6}
.dlist .body p{margin:4px 0}
.bars .row{display:grid;grid-template-columns:70px 1fr 70px;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.bars .track{position:relative;height:14px;background:#11161b;border-radius:7px}
.bars .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.bars .fill{position:absolute;top:0;bottom:0;border-radius:7px}
.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.lane{background:var(--panel2);border-radius:8px;padding:10px}
.lane .k{color:var(--muted);font-size:12px}.lane .v{font-size:20px;font-weight:bold}
.trip{display:flex;gap:8px;align-items:center;margin:4px 0}
.items{display:flex;flex-wrap:wrap;gap:8px}
.note{color:var(--muted);font-size:12px;margin-top:20px}
@media (max-width:820px){.grid{grid-template-columns:1fr}.deaths-wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const A = /*__DATA__*/null;
const CAUSE = {
  gank:["敵JGのガンク","#ff5d5d"], jg_duel:["敵JGとの戦い","#ff5d5d"], low_hp:["体力が低いまま","#ff9f43"],
  outnumbered:["人数不利","#ff9f43"], bad_trade:["1v1負け","#b48cff"], died_first:["戦いで最初に倒れた","#ffd166"],
  stayed_lost:["負け戦から引けず","#ffd166"], overextend:["前に出すぎ","#ff9f43"], traded:["相打ち・交換","#7a828c"],
  skirmish:["小競り合い負け","#b48cff"], unknown:["原因不明","#7a828c"], objective:["オブジェクト献上","#ff5d5d"],
  late_back:["帰還遅れ","#ff9f43"],
};
const MAP = 14870;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const vlink = t => `${A.match_id}_viewer.html#t=${Math.max(0, Math.round(t - 20))}`;
const icon = c => `assets/champion/${c}.png`;
const signed = (v, unit = "") => (v > 0 ? "+" : "") + v + unit;

function header() {
  const me = A.me, opp = A.opp, s = A.stats;
  const res = A.remake ? ["リメイク", "remake"] : A.win ? ["勝ち", "win"] : ["負け", "lose"];
  const date = new Date(A.game_start_ms).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  const role = { TOP: "TOP", JUNGLE: "JG", MIDDLE: "MID", BOTTOM: "ADC", UTILITY: "SUP" }[me.role] || me.role;
  return `<div class="top">
    <img src="${icon(me.champ)}" alt="" onerror="this.style.display='none'">
    <div><h1>${esc(me.champ_ja)}（${role}）${opp ? ` <span class="sub">vs ${esc(opp.champ_ja)}</span>` : ""}</h1>
      <div class="sub"><span class="badge ${res[1]}">${res[0]}</span>　${date}　試合時間 ${fmt(A.duration)}</div></div>
    <span class="sp"></span>
    <a class="btn" href="${A.match_id}_viewer.html">▶ 動画と解説で振り返る</a>
    <a class="btn ghost" href="index.html">試合一覧</a>
  </div>
  <div class="focus"><div class="k">次の試合で意識すること</div><div class="v">${esc(A.focus)}</div></div>
  <div class="stats">
    ${stat("KDA", `${s.kills}/${s.deaths}/${s.assists}`, s.deaths ? `KDA比 ${((s.kills + s.assists) / s.deaths).toFixed(1)}` : "デス0")}
    ${stat("CS / 分", s.cs_min, `合計 ${s.cs}`)}
    ${stat("キル関与率", s.kp + "%", "")}
    ${stat("視界スコア", s.vision_score, `${s.vision_min} / 分`)}
    ${stat("与ダメージ", (s.damage / 1000).toFixed(1) + "k", "")}
    ${laneStat()}
  </div>`;
}
function stat(k, v, d) { return `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d || "&nbsp;"}</div></div>`; }
function laneStat() {
  const r = (A.lane || []).find(x => x.min === 15) || (A.lane || []).find(x => x.min === 10);
  if (!r || r.gold_opp == null) return "";
  const g = r.gold - r.gold_opp;
  return stat(`${r.min}分のゴールド差`, `<span class="${g >= 0 ? "up" : "down"}">${signed(g)}</span>`, `CS差 ${signed(r.cs - r.cs_opp)}`);
}

function issues() {
  if (!A.issues.length) return `<div class="card"><h2>改善点</h2>目立った問題は見つかりませんでした。</div>`;
  const times = iss => (A.deaths || []).filter(d => d.cause && (d.cause.primary.key === iss.cause
    || (iss.cause === "objective" && d.lost_after.length))).map(d => d.t);
  return `<div class="card"><h2>改善点トップ3</h2>${A.issues.slice(0, 3).map((iss, i) => {
    const c = (CAUSE[iss.cause] || [, "var(--gold)"])[1];
    const ts = times(iss);
    return `<div class="issue" style="--c:${c}"><div class="t">${i + 1}. ${esc(iss.title)}</div>
      ${ts.length ? `<div class="when">${ts.map(t => `<a class="chip" href="${vlink(t)}">▶ ${fmt(t)}</a>`).join("")}</div>` : ""}
      <div class="sub" style="color:var(--muted);font-size:13px">${esc(iss.detail)}</div>
      <div class="fix">${esc(iss.focus)}</div></div>`;
  }).join("")}</div>`;
}

function goods() {
  return `<div class="card"><h2>良かった点</h2>${A.good.length
    ? `<div class="goods">${A.good.map(g => `<span class="good">✓ ${esc(g)}</span>`).join("")}</div>`
    : `<span style="color:var(--muted)">今回は特になし</span>`}
    ${objectives()}</div>`;
}

function objectives() {
  const os = A.objectives || [];
  if (!os.length) return "";
  const ic = o => ({ BARON_NASHOR: "👾", HORDE: "🪱", RIFTHERALD: "👁️", ATAKHAN: "😈" }[o.kind] || "🐉");
  const ours = os.filter(o => o.ours).length;
  return `<h2 style="margin-top:18px">オブジェクト <span class="n">味方 ${ours} / 敵 ${os.length - ours}</span></h2>
    <div class="tl"><div class="bar"></div>${os.map(o => `<a class="ob" title="${fmt(o.t)} ${esc(o.name)}（${o.ours ? "味方" : "敵"}）"
      href="${vlink(o.t)}" style="left:${o.t / A.duration * 100}%;top:${o.ours ? 0 : 24}px;filter:${o.ours ? "none" : "grayscale(.2) drop-shadow(0 0 3px #ff5d5d)"}">${ic(o)}</a>`).join("")}</div>
    <div class="legend"><span>上段: 味方が取得</span><span>下段: 敵が取得（赤く光る）</span></div>`;
}

function deaths() {
  const ds = A.deaths || [];
  const color = d => (CAUSE[d.cause ? d.cause.primary.key : "unknown"] || CAUSE.unknown)[1];
  const label = d => d.cause ? d.cause.primary.label : "原因不明";
  const used = [...new Set(ds.map(d => d.cause ? d.cause.primary.key : "unknown"))];
  const flip = A.me.team === 200;  // show the map from my side
  // mirror across the river diagonal so my base is bottom-left and TOP stays TOP
  const px = p => { const [x, y] = flip ? [MAP - p[1], MAP - p[0]] : p; return [x / MAP * 100, 100 - y / MAP * 100]; };
  return `<div class="card full"><h2>デス <span class="n">${ds.length}回</span></h2>
    ${ds.length ? `
    <div class="tl"><div class="bar"></div>${ds.map((d, i) => `<a class="dot" href="${vlink(d.t)}" title="${fmt(d.t)} ${esc(label(d))}"
      style="left:${d.t / A.duration * 100}%;background:${color(d)}"></a>`).join("")}</div>
    <div class="axis">${[0, .25, .5, .75, 1].map(f => `<span>${fmt(A.duration * f)}</span>`).join("")}</div>
    <div class="legend">${used.map(k => `<span><i style="background:${CAUSE[k][1]}"></i>${CAUSE[k][0]}</span>`).join("")}</div>
    <div class="deaths-wrap" style="margin-top:14px">
      <div><div class="map"><img src="assets/map11.png" alt="" onerror="this.remove()">
        ${ds.map((d, i) => { const [x, y] = px(d.pos); return `<span class="x" style="left:${x}%;top:${y}%;color:${color(d)}" title="${fmt(d.t)}">✕</span>`; }).join("")}
      </div><div class="legend">✕ = 倒された場所${flip ? "（自陣が左下になるよう反転）" : ""}</div></div>
      <div class="dlist">${ds.map((d, i) => {
        const c = d.cause;
        const lines = c ? [`<p><b>${esc(c.primary.why)}</b></p><p>💡 ${esc(c.primary.action)}</p>`,
          ...c.secondary.map(s => `<p>・${esc(s.label)}: ${esc(s.why)}</p>`),
          ...c.impacts.map(im => `<p style="color:var(--orange)">⚠ ${esc(im.why)}</p>`)] : [];
        const facts = [`倒した敵: ${esc(d.killer)}${d.assists.length ? "＋" + esc(d.assists.join("・")) : ""}`,
          `近くの味方: ${d.allies_near.length ? esc(d.allies_near.join("・")) : "なし"}`];
        if (d.hp_before != null) facts.push(`10秒前の体力 ${Math.round(d.hp_before * 100)}%`);
        if (d.gold_unspent != null) facts.push(`未使用 ${d.gold_unspent}G`);
        const clip = (A.clips || [])[i];
        if (clip && (clip.video || clip.stills.length)) {
          lines.push(`<div class="items" style="margin:6px 0">${clip.stills.map(s => `<img src="${s}" style="width:120px;border-radius:6px">`).join("")}</div>`
            + (clip.video ? `<a class="chip" href="${clip.video}">🎬 切り出し動画を開く</a>` : ""));
        }
        return `<details style="--c:${color(d)}"><summary><span class="tm">${fmt(d.t)}</span>
            <span class="lab">${esc(label(d))}</span><span style="color:var(--muted)">${esc(d.zone)}</span>
            <span class="sp"></span><a class="chip" href="${vlink(d.t)}" onclick="event.stopPropagation()">▶ 動画</a></summary>
          <div class="body">${lines.join("")}<div class="when">${facts.map(f => `<span class="chip">${f}</span>`).join(" ")}</div></div></details>`;
      }).join("")}</div>
    </div>` : `<span style="color:var(--muted)">デスなし 🎉</span>`}</div>`;
}

function lane() {
  const rows = (A.lane || []).filter(r => r.cs_opp != null);
  if (!rows.length) return "";
  const bar = (label, v, scale, unit) => {
    const w = Math.min(50, Math.abs(v) / scale * 50);
    return `<div class="row"><span>${label}</span><div class="track"><div class="mid"></div>
      <div class="fill" style="${v >= 0 ? `left:50%;width:${w}%;background:var(--blue)` : `right:50%;width:${w}%;background:var(--red)`}"></div></div>
      <span class="${v >= 0 ? "up" : "down"}">${signed(v)}${unit}</span></div>`;
  };
  return `<div class="card"><h2>レーン戦 <span class="n">対面 ${esc(A.opp ? A.opp.champ_ja : "")} との差（右が有利）</span></h2>
    <div class="bars">${rows.map(r => `<div style="color:var(--muted);font-size:12px;margin-top:6px">${r.min}分時点（レベル ${r.level} vs ${r.level_opp}）</div>
      ${bar("CS", r.cs - r.cs_opp, 30, "")}${bar("ゴールド", r.gold - r.gold_opp, 2000, "")}${bar("経験値", r.xp - r.xp_opp, 1500, "")}`).join("")}</div></div>`;
}

function roams() {
  const r = A.roams || {};
  const parts = [];
  if (r.opp) {
    const resp = { followed: ["追いかけた", "up"], farmed: ["CSを取った", "up"], nothing: ["何もできず", "down"] };
    parts.push(`<h2>対面のローム（15分まで）</h2>
      <div class="lanes" style="grid-template-columns:repeat(2,1fr)">
        <div class="lane"><div class="k">レーンを離れた回数（推定）</div><div class="v">${r.opp.trips.length}</div></div>
        <div class="lane"><div class="k">ロームでキル関与</div><div class="v ${r.opp.success.length ? "down" : ""}">${r.opp.success.length}</div></div>
      </div>
      ${r.opp.trips.map(tr => `<div class="trip"><span class="chip">${tr.start}〜${tr.end + 1}分</span>
        <span>${esc(tr.zones[0])}へ${tr.got_kill ? "（キルあり）" : ""}</span><span class="sp"></span>
        <span class="${resp[tr.response][1]}">自分: ${resp[tr.response][0]}</span></div>`).join("")}`);
  }
  if (r.mine && r.mine.ganks) {
    const g = r.mine.ganks;
    parts.push(`<h2>自分のガンク成功（15分まで）</h2><div class="lanes">${["TOP", "MID", "BOT"].map(l =>
      `<div class="lane"><div class="k">${l}</div><div class="v">${g[l]}</div></div>`).join("")}</div>`);
  } else if (r.mine) {
    parts.push(`<div style="margin-top:10px;color:var(--muted)">自分のローム: レーン外のキル関与 ${r.mine.success.length}回 / 離れた回数 ${r.mine.trips.length}</div>`);
  }
  if (r.enemy_jg) {
    const k = r.enemy_jg.kills, v = r.enemy_jg.visits;
    parts.push(`<h2 style="margin-top:16px">敵JGの動き（15分まで）</h2><div class="lanes">${["TOP", "MID", "BOT"].map(l =>
      `<div class="lane"><div class="k">${l}</div><div class="v ${k[l] ? "down" : ""}">${k[l]}キル</div>
        <div class="k">近くにいた ${v[l]}分</div></div>`).join("")}</div>`);
  }
  return parts.length ? `<div class="card">${parts.join("")}</div>` : "";
}

function items() {
  const it = A.items || [];
  if (!it.length) return "";
  const timed = it[0].t != null;
  return `<div class="card"><h2>アイテム ${timed ? "" : '<span class="n">（完成時刻のデータなし・最終ビルド）</span>'}</h2>
    <div class="items">${it.map(i => `<span class="chip">${timed ? fmt(i.t) + " " : ""}${esc(i.name)}${i.kind === "boots" ? "（靴）" : ""}</span>`).join("")}</div></div>`;
}

document.title = `${A.me.champ_ja} ${A.remake ? "リメイク" : A.win ? "勝ち" : "負け"} | Ascend InQ`;
document.getElementById("app").innerHTML = header() + `<div class="grid">${issues()}${goods()}${deaths()}${lane()}${roams()}${items()}</div>
  <div class="note">位置は1分ごとのデータからの推定です。体力・ゴールドは録画した試合だけ表示されます。</div>`;
</script>
</body>
</html>
